<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Вики ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Глубокий, завораживающий градиент */
    background: radial-gradient(circle at 50% 0%, #ff2a75 0%, #2b0b3f 60%, #0f041a 100%);
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
    perspective: 1000px;
  }

  /* Плавающие светящиеся слова на фоне */
  .love-word {
    position: absolute;
    color: rgba(255, 255, 255, 0.15);
    font-size: 22px;
    font-weight: bold;
    font-style: italic;
    white-space: nowrap;
    animation: floatUp linear infinite;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    z-index: 1;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(-10deg) scale(0.5); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-20vh) rotate(10deg) scale(1.5); opacity: 0; }
  }

  /* Эффект стеклянной карточки */
  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 30px;
    padding: 50px 40px;
    max-width: 450px;
    width: 90%;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
    animation: cardIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    z-index: 10;
    transform-style: preserve-3d;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(50px) scale(0.9) rotateX(20deg); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
  }

  /* Неоновое сердце */
  .big-heart {
    font-size: 70px;
    display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px #ff2a75) drop-shadow(0 0 40px #ff2a75);
    transform: translateZ(50px); /* 3D эффект */
  }
  @keyframes beat {
    0%, 100% { transform: translateZ(50px) scale(1); }
    25%      { transform: translateZ(50px) scale(1.15); }
    50%      { transform: translateZ(50px) scale(1); }
    75%      { transform: translateZ(50px) scale(1.1); }
  }

  h1 {
    font-size: 32px;
    color: #fff;
    margin: 20px 0 15px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    transform: translateZ(30px);
  }

  p {
    font-size: 17px;
    line-height: 1.8;
    color: #e0d0e8;
    margin-bottom: 25px;
    font-style: italic;
    transform: translateZ(20px);
  }

  .signature {
    font-size: 16px;
    color: #ff8ab3;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 30px;
    transform: translateZ(20px);
  }

  /* Кнопка */
  .btn {
    padding: 16px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff2a75, #ff8ab3);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    font-family: 'Georgia', serif;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 42, 117, 0.4);
    transition: all 0.3s ease;
    transform: translateZ(40px);
    position: relative;
    overflow: hidden;
  }
  .btn:hover {
    transform: translateZ(40px) translateY(-5px) scale(1.05);
    box-shadow: 0 15px 40px rgba(255, 42, 117, 0.6);
  }
  .btn:active { transform: translateZ(40px) scale(0.95); }
  .btn.hidden { opacity: 0; pointer-events: none; }

  /* Скрытый блок с признанием */
  .surprise-wrap {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.9);
    transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .surprise-wrap.show {
    max-height: 300px;
    opacity: 1;
    transform: scale(1);
    margin-top: 20px;
  }

  .surprise-text {
    font-size: 24px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 15px #ff2a75;
    line-height: 1.5;
    animation: pulseText 2s infinite;
  }
  @keyframes pulseText {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); text-shadow: 0 0 25px #ff2a75; }
  }

  /* Сердечки для салюта */
  .flying-heart {
    position: absolute;
    pointer-events: none;
    z-index: 999;
    font-size: 30px;
    animation: fly 1.5s ease-out forwards;
  }
  @keyframes fly {
    0% { transform: translate(0, 0) scale(0); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <div class="big-heart">❤️</div>
    <h1>Моей Вике</h1>
    <p>
      Ты — мой самый яркий свет<br>
      и моё самое большое чудо.<br>
      Каждый миг с тобой бесценен.
    </p>
    <div class="signature">— Твой навсегда</div>

    <button class="btn" id="btn">Нажми меня 💌</button>

    <div class="surprise-wrap" id="surpriseWrap">
      <div class="surprise-text">
        Я люблю тебя, Вика!<br>
        ❤️ Бесконечно ❤️
      </div>
    </div>
  </div>

<script>
  // 1. Фон: бесконечно плавающие слова
  function createLoveWord() {
    const w = document.createElement('div');
    w.className = 'love-word';
    w.textContent = 'Я люблю тебя Вика';
    w.style.left = Math.random() * 100 + 'vw';
    w.style.fontSize = (18 + Math.random() * 20) + 'px';
    w.style.animationDuration = (8 + Math.random() * 8) + 's';
    document.body.appendChild(w);
    setTimeout(() => w.remove(), 16000);
  }
  for (let i = 0; i < 5; i++) setTimeout(createLoveWord, i * 500);
  setInterval(createLoveWord, 800);

  // 2. Эффект параллакса (карточка слегка наклоняется за мышкой)
  const card = document.getElementById('card');
  document.addEventListener('mousemove', (e) => {
    const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
  });
  // Возврат в исходное положение, если мышка ушла
  document.addEventListener('mouseleave', () => {
    card.style.transform = `rotateY(0deg) rotateX(0deg)`;
  });

  // 3. Салют из сердечек при нажатии
  const btn = document.getElementById('btn');
  const surpriseWrap = document.getElementById('surpriseWrap');
  
  btn.addEventListener('click', (e) => {
    // Прячем кнопку и показываем текст
    btn.classList.add('hidden');
    surpriseWrap.classList.add('show');

    // Запускаем салют
    const rect = btn.getBoundingClientRect();
    const startX = rect.left + rect.width / 2;
    const startY = rect.top + rect.height / 2;

    for (let i = 0; i < 30; i++) {
      createFireworkHeart(startX, startY);
    }
  });

  function createFireworkHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'flying-heart';
    heart.textContent = ['❤️', '💖', '💕', '💗', '🌸'][Math.floor(Math.random() * 5)];
    
    // Начальная позиция
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';

    // Случайный разлет
    const angle = Math.random() * Math.PI * 2;
    const distance = 50 + Math.random() * 200;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;
    
    heart.style.setProperty('--tx', `${tx}px`);
    heart.style.setProperty('--ty', `${ty}px`);
    heart.style.setProperty('--rot', `${Math.random() * 360}deg`);
    heart.style.fontSize = (15 + Math.random() * 25) + 'px';

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1500);
  }
</script>
</body>
</html>
